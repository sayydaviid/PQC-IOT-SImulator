x-pqc-common: &pqc-common
  build:
    context: .
    dockerfile: Dockerfile
  image: pqc_iot_simulator:latest
  privileged: true
  network_mode: host
  init: true
  working_dir: /workspace

  volumes:
    - .:/workspace
    - /lib/modules:/lib/modules:ro
    - /sys/kernel/debug:/sys/kernel/debug
    - /dev:/dev

  environment:
    PYTHONPATH: /workspace:/opt/pqc-tls/native:/opt/pqc-tls/continuity:/opt/pqc-tls/context_costs
    LD_LIBRARY_PATH: /opt/pqc-tls/lib:/usr/local/lib:/usr/local/lib64
    OQS_INSTALL_PATH: /usr/local
    MPLBACKEND: Agg
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"

services:
  pqc_iot_simulator:
    <<: *pqc-common
    container_name: pqc_iot_simulator

    command:
      - python3
      - -m
      - pqc_iot_simulator.pqc_iot_sim.main

  notebook:
    <<: *pqc-common
    container_name: pqc_iot_notebook

    command: ["sleep", "infinity"]
