services:
  notebook:
    image: pqc-iot-continuity:organizacao
    build:
      context: .
      dockerfile: docker/continuity/Dockerfile
    environment:
      LD_LIBRARY_PATH: /opt/pqc-tls/lib:/usr/local/lib:/usr/local/lib64
      PYTHONPATH: /workspace:/opt/pqc-tls/native:/opt/pqc-tls/continuity
